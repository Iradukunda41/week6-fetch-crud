<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posts Manager</title>
</head>

<body class="bg-gray-50 text-gray-800">
  <main class="mx-auto max-w-3xl p-6 space-y-6">
    <h1 class="text-3xl font-bold">Posts Manager</h1>

    <form id="post-form" class="space-y-3 rounded bg-white p-4 shadow">
      <label class="block">Title
        <input name="title" required class="block w-full border rounded px-3 py-2">
      </label>
      <label class="block">Body
        <textarea name="body" required class="block w-full border rounded px-3 py-2"></textarea>
      </label>
      <button class="rounded bg-indigo-600 px-4 py-2 text-white disabled:opacity-50">Publish</button>
      <p id="form-status" aria-live="polite"></p>
    </form>

    <label class="block">Filter by user
      <select id="user-filter" class="border rounded px-3 py-2 ml-2">
        <option value="">All users</option>
      </select>
    </label>

    <p id="list-status" aria-live="polite"></p>
    <section id="posts" class="space-y-4"></section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
